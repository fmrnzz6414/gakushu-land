<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="がくしゅうランド">
<title>がくしゅうランド</title>
<style>
/* iOS 12 Safari 対応：flex の gap / aspect-ratio / inset / :is などは使わない */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:#fff8e7;color:#3b3a36;touch-action:manipulation;overflow:hidden;}
body.lv2{background:#eef6ff;}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation;}
.screen{display:none;position:absolute;top:0;left:0;right:0;bottom:0;padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.active{display:flex;flex-direction:column;align-items:center;}

/* ホーム */
h1{font-size:40px;margin:6px 0 4px;color:#e8743b;text-shadow:3px 3px 0 #ffe0b8;}
.sub{font-size:20px;margin:0 0 10px;color:#8a7a60;}
.levels{display:flex;justify-content:center;margin-bottom:4px;}
.lv-btn{margin:0 10px;padding:10px 24px;border-radius:40px;font-size:26px;font-weight:bold;background:#fff;color:#b5a78a;box-shadow:0 5px 0 #e6d6b3;}
.lv-btn.on1{background:#ffcf7a;color:#7a4a00;box-shadow:0 5px 0 #e0a94a;}
.lv-btn.on2{background:#8cc4f5;color:#123e6b;box-shadow:0 5px 0 #5a97d0;}
.menu{display:flex;flex-wrap:wrap;justify-content:center;max-width:920px;}
.menu-btn{width:210px;margin:8px;padding:16px 8px;border-radius:26px;font-size:25px;font-weight:bold;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18);}
.menu-btn:active,.lv-btn:active{-webkit-transform:translateY(5px);transform:translateY(5px);}
.menu-btn .ico{display:block;font-size:52px;margin-bottom:4px;}
.c-math{background:#f2994a;} .c-clock{background:#56a8e8;} .c-kana{background:#5cbf7a;} .c-kanji{background:#a986d8;}
.board{margin-top:12px;width:100%;max-width:860px;background:#fff;border-radius:24px;padding:12px 18px;box-shadow:0 4px 0 #f0e2c4;}
.board h2{margin:0 0 6px;font-size:22px;color:#b08a3c;}
.stickers{font-size:38px;line-height:1.35;max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;word-wrap:break-word;}
.stickers .empty{font-size:20px;color:#b5a78a;}
.reset{margin-top:12px;background:none;color:#c8b894;font-size:14px;text-decoration:underline;}

/* ゲーム */
.topbar{width:100%;max-width:920px;display:flex;align-items:center;justify-content:space-between;}
.home-btn{font-size:32px;background:#fff;border-radius:50%;width:60px;height:60px;box-shadow:0 4px 0 #f0e2c4;}
.mode-title{font-size:23px;font-weight:bold;color:#8a7a60;text-align:center;}
.badge{display:inline-block;font-size:15px;padding:3px 10px;border-radius:20px;margin-right:6px;vertical-align:middle;}
.badge.b1{background:#ffcf7a;color:#7a4a00;} .badge.b2{background:#8cc4f5;color:#123e6b;}
.dots span{display:inline-block;width:28px;height:28px;margin-left:5px;border-radius:50%;background:#eadfc8;text-align:center;line-height:28px;font-size:19px;vertical-align:middle;}
.dots span.now{background:#ffd66b;}
.dots span.done{background:none;}
.qarea{margin-top:8px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.prompt{font-size:28px;font-weight:bold;margin:6px 0 10px;text-align:center;}
.choices{display:flex;flex-wrap:wrap;justify-content:center;max-width:920px;}
.choice{position:relative;min-width:190px;margin:10px;padding:14px 22px;border-radius:24px;background:#fff;font-size:40px;font-weight:bold;color:#3b3a36;box-shadow:0 7px 0 #e6d6b3;border:5px solid #f7e2b0;}
.choice.ok{background:#8fdca0;border-color:#5cae70;box-shadow:0 7px 0 #5cae70;}
.choice.ng{background:#eee;color:#bbb;border-color:#ddd;box-shadow:0 7px 0 #ddd;-webkit-animation:shake .35s;animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0);}25%{-webkit-transform:translateX(-10px);}75%{-webkit-transform:translateX(10px);}}

/* 弓矢 */
#bow{position:fixed;left:50%;bottom:4px;margin-left:-30px;font-size:46px;z-index:40;pointer-events:none;display:none;-webkit-transition:-webkit-transform .12s;transition:transform .12s;}
#bow.shoot{-webkit-transform:translateY(10px) scale(.88);transform:translateY(10px) scale(.88);}
.arrow{position:fixed;z-index:60;pointer-events:none;margin-left:-32px;margin-top:-8px;}
.burst{position:fixed;z-index:61;font-size:70px;margin-left:-35px;margin-top:-40px;pointer-events:none;-webkit-animation:pop .45s;animation:pop .45s;}

/* さんすう */
.eq{font-size:60px;font-weight:bold;letter-spacing:4px;}
.apples{font-size:38px;margin:4px 0;text-align:center;max-width:820px;}
.apples .op{display:inline-block;margin:0 12px;font-weight:bold;color:#e8743b;}
.apples .gone{opacity:.25;}
.grid{margin-top:6px;text-align:center;line-height:1;}
.grid .row{font-size:20px;letter-spacing:4px;color:#e8743b;margin:2px 0;}
.hint{font-size:17px;color:#a8987a;margin-top:6px;text-align:center;}
/* もじ */
.big-emoji{font-size:130px;line-height:1.1;}
.sentence{font-size:40px;line-height:1.7;text-align:center;max-width:880px;}
.sentence .target{display:inline-block;padding:0 8px;margin:0 4px;background:#fff3b0;border-bottom:5px solid #e8743b;border-radius:6px;font-family:"Hiragino Mincho ProN","Hiragino Sans",serif;font-weight:bold;}
body.lv2 .sentence .target{background:#d8ecff;border-bottom-color:#3b6fb0;}

/* とけい ダイヤル */
.clockwrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;}
.dial{position:relative;width:210px;height:210px;margin:6px 10px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #e6d6b3;}
.dial .center{position:absolute;left:55px;top:72px;width:100px;height:66px;text-align:center;font-size:36px;font-weight:bold;color:#3b3a36;line-height:66px;}
.dial .cap{position:absolute;left:55px;top:44px;width:100px;text-align:center;font-size:15px;color:#a8987a;}
.dnum{position:absolute;width:48px;height:48px;border-radius:50%;background:#f6efdd;color:#7a6a4a;font-size:19px;font-weight:bold;line-height:48px;text-align:center;padding:0;}
.dnum.sel{background:#f2994a;color:#fff;}
body.lv2 .dnum.sel{background:#3b6fb0;}
.decide{margin-top:8px;padding:14px 40px;border-radius:30px;font-size:30px;font-weight:bold;color:#fff;background:#5cbf7a;box-shadow:0 7px 0 #47965f;}
.decide:active{-webkit-transform:translateY(5px);transform:translateY(5px);box-shadow:0 2px 0 #47965f;}

/* 結果 */
.result-sticker{font-size:160px;margin-top:16px;-webkit-animation:pop .6s;animation:pop .6s;}
@keyframes pop{0%{transform:scale(.2);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.2);}70%{-webkit-transform:scale(1.15);}100%{-webkit-transform:scale(1);}}
.result-msg{font-size:38px;font-weight:bold;color:#e8743b;margin:8px 0;text-align:center;}
.result-score{font-size:25px;margin-bottom:16px;}

/* 紙ふぶき */
.conf{position:fixed;top:-60px;pointer-events:none;z-index:50;-webkit-animation:fall 1.5s ease-in forwards;animation:fall 1.5s ease-in forwards;}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);}}
@-webkit-keyframes fall{to{-webkit-transform:translateY(115vh) rotate(360deg);}}
</style>
</head>
<body>

<!-- ホーム -->
<div id="home" class="screen active">
  <h1>がくしゅうランド</h1>
  <p class="sub">なんねんせい かな？</p>
  <div class="levels">
    <button id="lv1" class="lv-btn">🐣 1ねんせい</button>
    <button id="lv2" class="lv-btn">🐥 2ねんせい</button>
  </div>
  <div id="menu" class="menu"></div>
  <div class="board">
    <h2 id="boardTitle"></h2>
    <div id="stickers" class="stickers"></div>
  </div>
  <button id="reset" class="reset">この がくねんの シールを リセット（おとなのひと用）</button>
</div>

<!-- ゲーム -->
<div id="game" class="screen">
  <div class="topbar">
    <button id="goHome" class="home-btn">🏠</button>
    <div id="modeTitle" class="mode-title"></div>
    <div id="dots" class="dots"></div>
  </div>
  <div id="qarea" class="qarea"></div>
  <div id="prompt" class="prompt"></div>
  <div id="answerArea"></div>
</div>

<!-- 結果 -->
<div id="result" class="screen">
  <div id="resSticker" class="result-sticker"></div>
  <div id="resMsg" class="result-msg"></div>
  <div id="resScore" class="result-score"></div>
  <div class="menu">
    <button id="again" class="menu-btn c-math">もういっかい</button>
    <button id="toHome" class="menu-btn c-clock">おうちに もどる</button>
  </div>
</div>

<div id="bow">🏹</div>

  function parseSents(list){
    var out = [];
    for(var i=0;i<list.length;i++){
      var m = /【(.+?)=(.+?)】/.exec(list[i]);
      if(!m) continue;
      out.push({before:list[i].slice(0,m.index), word:m[1], yomi:m[2],
                after:list[i].slice(m.index+m[0].length),
                plain:list[i].replace(/【(.+?)=(.+?)】/,"$1")});
    }
    return out;
  }

  var jaVoice = null;
  function findVoice(){
    if(!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices(), best = null, bestScore = -1;
    for(var i=0;i<vs.length;i++){
      var v = vs[i];
      if(!v.lang || v.lang.toLowerCase().indexOf("ja") !== 0) continue;
      var n = (v.name || "").toLowerCase(), s = 1;
      if(n.indexOf("kyoko") >= 0) s = 6;            // iOS の 日本語（女性）
      else if(n.indexOf("o-ren") >= 0) s = 5;
      else if(n.indexOf("otoya") >= 0) s = 4;
      else if(n.indexOf("siri") >= 0) s = 5;
      if(n.indexOf("enhanced") >= 0 || n.indexOf("premium") >= 0) s += 2;
      if(n.indexOf("compact") >= 0) s -= 1;
      if(v.localService) s += 1;
      if(s > bestScore){ bestScore = s; best = v; }
    }
    if(best) jaVoice = best;
  }
  if(window.speechSynthesis){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
  // 読み上げは「漢字まじり・スペースなし・句読点あり」のほうが しぜんに 聞こえる
  function say(text){

      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP"; u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
      if(jaVoice) u.voice = jaVoice;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- おと ---------- */
  var actx = null;
  function tone(freqs, dur, type){
    try{
      if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
      if(actx.state === "suspended" && actx.resume) actx.resume();
      var t0 = actx.currentTime;
      freqs.forEach(function(f,i){
        var o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*0.1;
        o.type = type || "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+dur+0.05);
      });
    }catch(e){}
  }

    }

  /* ---------- 弓矢の えんしゅつ ---------- */
  var ARROW_SVG = '<svg width="64" height="16" viewBox="0 0 64 16">' +
    '<line x1="2" y1="8" x2="50" y2="8" stroke="#8a5a2b" stroke-width="4"/>' +
    '<polygon points="64,8 46,1 46,15" fill="#e8743b"/>' +
    '<polygon points="2,8 12,2 12,14" fill="#f5d76e"/></svg>';
  function shootArrow(targetEl, ok, cb){
    var r = targetEl.getBoundingClientRect();
    var tx = r.left + r.width/2, ty = r.top + r.height/2;
    var sx = window.innerWidth/2, sy = window.innerHeight - 34;
    var ang = Math.atan2(ty-sy, tx-sx) * 180 / Math.PI;
    var bow = $("bow");
    bow.style.display = "block"; bow.className = "shoot";
    setTimeout(function(){ bow.className = ""; }, 140);
    var a = document.createElement("div");
    a.className = "arrow"; a.innerHTML = ARROW_SVG;
    a.style.left = sx + "px"; a.style.top = sy + "px";
    a.style.webkitTransform = a.style.transform = "rotate(" + ang + "deg)";
    document.body.appendChild(a);
    tone([900,500], 0.07, "triangle");
    a.offsetWidth; // レイアウトを かくてい させる
    a.style.webkitTransition = a.style.transition = "left .3s ease-in, top .3s ease-in";
    a.style.left = tx + "px"; a.style.top = ty + "px";
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      var b = document.createElement("div");
      b.className = "burst"; b.textContent = ok ? "💥" : "💨";
      b.style.left = tx + "px"; b.style.top = ty + "px";
      document.body.appendChild(b);
      setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 500);
      cb();
    }, 330);
  }

  /* ---------- せんたくし ---------- */
  function makeChoices(ans, cands, lo, hi){
    var set = [ans];
    shuffle(cands.slice()).forEach(function(d){
      if(set.length < 3 && d>=lo && d<=hi && set.indexOf(d)<0) set.push(d);
    });
    var guard = 0;
    while(set.length < 3 && guard < 200){ guard++; var r = rand(lo,hi); if(set.indexOf(r)<0) set.push(r); }
    return shuffle(set.map(String));
  }

  /* ---------- さんすう ---------- */
  function genMath1(){
    var add = Math.random() < 0.5, a, b, ans, html, speak;
    if(add){
      a = rand(1,9); b = rand(1,10-a); ans = a+b;
      html = '<div class="eq">'+a+' ＋ '+b+' ＝ ？</div><div class="apples">'+repeat("🍎",a)+'<span class="op">＋</span>'+repeat("🍎",b)+'</div>';
      speak = a+"たす"+b+"は、いくつ？";
    } else {
      a = rand(2,10); b = rand(1,a-1); ans = a-b;
      html = '<div class="eq">'+a+' − '+b+' ＝ ？</div><div class="apples">'+repeat("🍎",a-b)+'<span class="gone">'+repeat("🍎",b)+'</span></div><div class="hint">うすい りんごは たべちゃったよ</div>';
      speak = a+"ひく"+b+"は、いくつ？";
    }
    return {kind:"choice", html:html, prompt:"こたえを ゆみやで うとう！", speak:speak,
            choices:makeChoices(ans,[ans-2,ans-1,ans+1,ans+2],0,10), answer:String(ans),
            after:speak.replace("、いくつ？","は、")+ans+"。"};
  }
  function genMath2(){
    var r = Math.random(), a, b, ans, html, speak, cands;
    if(r < 0.35){
      do { a = rand(11,89); b = rand(11,99-a); } while(Math.random() < 0.6 && (a%10 + b%10) < 10);
      ans = a+b;
      html = '<div class="eq">'+a+' ＋ '+b+' ＝ ？</div><div class="hint">一のくらいから けいさんしよう</div>';
      speak = a+"たす"+b+"は、いくつ？"; cands = [ans-10, ans+10, ans-1, ans+1];
    } else if(r < 0.65){
      do { a = rand(21,99); b = rand(11,a-1); } while(Math.random() < 0.6 && (a%10) >= (b%10));
      ans = a-b;
      html = '<div class="eq">'+a+' − '+b+' ＝ ？</div><div class="hint">一のくらいから けいさんしよう</div>';
      speak = a+"ひく"+b+"は、いくつ？"; cands = [ans+10, ans-10, ans+1, ans-1];
    } else {
      a = rand(2,9); b = rand(1,9); ans = a*b;
      var grid = "";
      if(ans <= 45){
        grid = '<div class="grid">';
        for(var i=0;i<b;i++) grid += '<div class="row">'+repeat("●",a)+'</div>';
        grid += '</div><div class="hint">●が '+a+'こずつ '+b+'れつ</div>';
      }
      html = '<div class="eq">'+a+' × '+b+' ＝ ？</div>'+grid;
      speak = a+"かける"+b+"は、いくつ？"; cands = [ans+a, ans-a, ans+b, ans-b, ans+1, ans-1];
    }
    return {kind:"choice", html:html, prompt:"こたえを ゆみやで うとう！", speak:speak,
            choices:makeChoices(ans,cands,0,99), answer:String(ans),
            after:speak.replace("、いくつ？","は、")+ans+"。"};
  }

  /* ---------- とけい（ダイヤルで あわせる） ---------- */
  function clockSVG(h, m, size){
    var ha = ((h%12) + m/60) * 30, ma = m * 6, s = size || 240;
    var out = '<svg width="'+s+'" height="'+s+'" viewBox="0 0 200 200">';
    out += '<circle cx="100" cy="100" r="92" fill="#fff" stroke="#56a8e8" stroke-width="8"/>';
    for(var i=1;i<=12;i++){
      var ang = (i*30 - 90) * Math.PI/180;
      out += '<text x="'+(100+72*Math.cos(ang))+'" y="'+(100+72*Math.sin(ang)+8)+'" font-size="22" font-weight="bold" text-anchor="middle" fill="#3b3a36">'+i+'</text>';
    }
    for(var k=0;k<60;k++){
      var a2 = (k*6 - 90) * Math.PI/180, big = k%5===0;
      out += '<circle cx="'+(100+86*Math.cos(a2))+'" cy="'+(100+86*Math.sin(a2))+'" r="'+(big?2.6:1.6)+'" fill="'+(big?"#8a7a60":"#c9bfa9")+'"/>';
    }
    out += '<line x1="100" y1="100" x2="100" y2="50" stroke="#e8743b" stroke-width="9" stroke-linecap="round" transform="rotate('+ha+' 100 100)"/>';
    out += '<line x1="100" y1="100" x2="100" y2="26" stroke="#3b6fb0" stroke-width="5" stroke-linecap="round" transform="rotate('+ma+' 100 100)"/>';
    out += '<circle cx="100" cy="100" r="7" fill="#3b3a36"/></svg>';
    return out;
  }
  function timeLabel(h, m, lv){
    if(lv === 1 && m === 30) return h + "時半";
    return h + "時" + (m === 0 ? "" : m + "分");
  }
  function genClock1(){
    var h = rand(1,12), m = Math.random() < 0.5 ? 0 : 30;
    return {kind:"dial", h:h, m:m, html:clockSVG(h,m,210),

            speak:"いま、なんじかな？", after:timeLabel(h,m,1)+"だよ。"};

  /* ---------- カタカナ ---------- */

  /* ---------- かんじ（文の中の よみ） ---------- */
  function genKanji(){
    var pool = KANJI[state.level];
    var i, guard = 0;
    do { i = Math.floor(Math.random()*pool.length); guard++; } while(state.used.indexOf(i) >= 0 && guard < 100);
    state.used.push(i);
    var q = pool[i];
    // まちがいの せんたくしは、おなじくらいの ながさの よみから えらぶ
    var cands = [];
    for(var k=0;k<pool.length;k++){
      if(k === i) continue;
      var y = pool[k].yomi;
      if(y === q.yomi || cands.indexOf(y) >= 0) continue;
      if(Math.abs(y.length - q.yomi.length) <= 1) cands.push(y);
    }
    shuffle(cands);
    var set = [q.yomi, cands[0], cands[1]];
    return {kind:"choice",
            html:'<div class="sentence">'+q.before+'<span class="target">'+q.word+'</span>'+q.after+'</div>',
            prompt:"いろの ついた ことばの よみを うとう！",
            speak:"いろのついたことばは、なんてよむかな？",
            choices:shuffle(set), answer:q.yomi, after:q.plain};
  }

  function choose(btn, label){
    if(state.locked || btn.disabled) return;
    var ok = (label === state.current.answer);

    shootArrow(btn, ok, function(){
      if(ok){ btn.className = "choice ok"; correct(); }
      else {
        state.firstTry = false; state.locked = false;
        btn.className = "choice ng"; btn.disabled = true;
        tone([240,200], 0.2);
        say("おしい！もう一回。");
      }
    });

  function buildDials(){

    fillDial("dialH", 1, "時", function(v){ state.dialH = v; });

    $("decide").addEventListener("click", decide);

  }
  // start=1 … 1〜12（時）／start=0 … 0,5,…,55（分）
  function fillDial(id, start, unit, setter){
    var dial = $(id);
    for(var i=0;i<12;i++){
      var val = start === 1 ? (i === 0 ? 12 : i) : i*5;
      var pos = start === 1 ? (val % 12) : i;         // 12時は てっぺん
      var ang = (pos*30 - 90) * Math.PI/180;
      var b = document.createElement("button");
      b.className = "dnum"; b.textContent = val;
      b.setAttribute("data-val", val);
      b.style.left = (105 + 80*Math.cos(ang) - 24) + "px";
      b.style.top  = (105 + 80*Math.sin(ang) - 24) + "px";
      (function(v){ b.addEventListener("click", function(){
        setter(v); tone([700], 0.05, "square"); updateDials();
      }); })(val);
      dial.appendChild(b);
    }
  }
  function updateDials(){
    [["dialH", state.dialH, "時"], ["dialM", state.dialM, "分"]].forEach(function(d){
      var dial = $(d[0]);
      if(!dial) return;
      dial.querySelector(".center").textContent = d[1] + d[2];
      var ns = dial.querySelectorAll(".dnum");
      for(var i=0;i<ns.length;i++){
        ns[i].className = "dnum" + (parseInt(ns[i].getAttribute("data-val"),10) === d[1] ? " sel" : "");
      }
    });
  }
  function decide(){
    if(state.locked) return;
    var q = state.current;
    if(state.dialH === q.h && state.dialM === q.m){
      state.locked = true;
      $("qarea").innerHTML = clockSVG(q.h, q.m, 210) + '<div class="hint">' + timeLabel(q.h,q.m,state.level) + '</div>';
      correct();
    } else {
      state.firstTry = false;
      var w = $("answerArea");
      w.className = "ng-shake";
      w.style.webkitAnimation = w.style.animation = "shake .35s";
      setTimeout(function(){ w.style.webkitAnimation = w.style.animation = ""; }, 400);
      tone([240,200], 0.2);
      say(state.dialH !== q.h ? "おしい！みじかいはりを よく見てね。" : "おしい！ながいはりを よく見てね。");
    }
  }

  /* ---------- せいかい／おわり ---------- */
  function correct(){
    if(state.firstTry) state.score++;
    state.marks.push(state.firstTry ? "⭐" : "⭕");
    tone([523,659,784], 0.28);
    confetti();
    say(pick(PRAISES) + state.current.after);
    state.idx++;
    renderDots();
    setTimeout(nextQuestion, 2000);
  }
  function finish(){
    var sticker = pick(STICKER_POOL);
    var list = loadStickers().slice(); list.push(sticker); saveStickers(list);
    $("resSticker").textContent = sticker;
    var perfect = state.score === TOTAL;
    $("resMsg").textContent = perfect ? "ぜんもん いっぱつ せいかい！" : "よく がんばったね！";
    $("resScore").textContent = "⭐ " + state.score + " / " + TOTAL;
    show("result");
    tone([523,659,784,1046], 0.35);
    confetti();
    say((perfect ? "すごい！全部、一発で正解！" : "よく頑張ったね！") + "シールをゲット！");
  }
  function goHome(){ try{speechSynthesis.cancel();}catch(e){} renderHome(); show("home"); }

  /* ---------- ボタン ---------- */
  $("lv1").addEventListener("click", function(){ setLevel(1); });
  $("lv2").addEventListener("click", function(){ setLevel(2); });
  $("goHome").addEventListener("click", goHome);
  $("again").addEventListener("click", function(){ startGame(state.mode); });
  $("toHome").addEventListener("click", goHome);
  $("reset").addEventListener("click", function(){
    if(confirm(state.level + "ねんせいの シールを ぜんぶ けしますか？")){ saveStickers([]); renderHome(); }
  });

  state.level = getItem("gl_level") === "2" ? 2 : 1;
  renderHome();
  window.__gl = {GEN:GEN, KANJI:KANJI, state:state};
})();
</script>
</body>
</html>
